version: "3"

vars:
  # Every ecosystem package in the monorepo (single source of truth).
  PACKAGES: >-
    telega_wisp telega_mist telega_httpc telega_hackney
    telega_webapp telega_i18n
    telega_storage_postgres telega_storage_sqlite telega_storage_redis
  # Standalone example projects under examples/.
  EXAMPLES: >-
    00-echo-bot 01-commands-bot 02-session-bot 03-conversation-bot
    04-keyboard-bot 05-media-group-bot 06-restaurant-booking
    07-streaming-bot 08-group-bot 09-webhook-wisp 10-inline-and-payments

tasks:
  format:
    desc: Format root project
    cmd: gleam format

  format:all:
    desc: Format root project, all ecosystem packages, and all examples
    cmds:
      - gleam format
      - for: { var: PACKAGES }
        cmd: cd {{.ITEM}} && gleam format
      - for: { var: EXAMPLES }
        cmd: cd examples/{{.ITEM}} && gleam format

  codegen:fetch:
    desc: Download the latest Telegram Bot API spec (PaulSonOfLars/telegram-bot-api-spec)
    cmd: curl -fsSL https://raw.githubusercontent.com/PaulSonOfLars/telegram-bot-api-spec/main/api.json -o codegen/api.json

  codegen:
    desc: Regenerate the model layer (types/decoder/encoder) from codegen/api.json
    cmds:
      - cd codegen && gleam run
      - gleam format src
      - gleam check

  codegen:diff:
    desc: Show what the last codegen run changed in the model layer
    cmd: git --no-pager diff --stat -- src/telega/model

  codegen:check:
    desc: >
      Fail if the checked-in generated code does not match `codegen/api.json`.
      Hashes every generated file, regenerates in place, and compares — so a
      hand edit to a generated file, or a spec bump nobody regenerated, cannot
      pass CI. Also runs the generator's own checks: every spec method has a
      wrapper in `api.gleam`, and every method is classified as (non-)idempotent.
    vars:
      GENERATED: >-
        src/telega/model/types.gleam src/telega/model/decoder.gleam
        src/telega/model/encoder.gleam src/telega/internal/method_info.gleam
        src/telega/internal/update_info.gleam src/telega/update.gleam
    cmd: |
      set -eu
      BEFORE=$(shasum {{.GENERATED}})
      ( cd codegen && gleam run )
      gleam format src
      AFTER=$(shasum {{.GENERATED}})
      if [ "${BEFORE}" != "${AFTER}" ]; then
        echo ""
        echo "Generated code is out of date. Files that changed when regenerating:"
        diff <(echo "${BEFORE}") <(echo "${AFTER}") | sed -nE 's/^> [0-9a-f]+  (.*)/  \1/p'
        echo ""
        echo "Run 'task codegen' and commit the result."
        exit 1
      fi
      echo "Generated code matches codegen/api.json."

  api:check:
    desc: >
      Fail if the Bot API version is not the same in every place that states
      it: the vendored spec, the two generated tables, and README.md (plus
      CLAUDE.md when the checkout has one — it is not tracked).
    cmd: |
      set -u
      version_of() { sed -nE 's/^\*\*Bot API version:\*\* (Bot API [0-9.]+).*/\1/p' "$1" | head -1; }
      SPEC=$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' codegen/api.json | head -1)
      if [ -z "${SPEC}" ]; then
        echo "Could not read a version out of codegen/api.json."
        exit 1
      fi
      echo "codegen/api.json: ${SPEC}"
      failed=0
      for table in method_info update_info; do
        HAVE=$(sed -nE 's/^pub const bot_api_version = "(.+)"$/\1/p' "src/telega/internal/${table}.gleam")
        if [ "${SPEC}" != "${HAVE}" ]; then
          echo "  ${table}.gleam says '${HAVE}' — run 'task codegen'"
          failed=1
        fi
      done
      for doc in README.md CLAUDE.md; do
        [ -f "${doc}" ] || continue
        HAVE=$(version_of "${doc}")
        if [ -z "${HAVE}" ]; then
          echo "  ${doc} has no '**Bot API version:**' line"
          failed=1
        elif [ "${SPEC}" != "${HAVE}" ]; then
          echo "  ${doc} says '${HAVE}'"
          failed=1
        fi
      done
      if [ "${failed}" -ne 0 ]; then
        echo ""
        echo "Bot API version disagrees with codegen/api.json."
        exit 1
      fi
      echo "Bot API version agrees everywhere."

  api:latest:
    desc: >
      Report whether a newer Bot API spec is published upstream than the one
      vendored in codegen/api.json. Informational — never fails on being behind.
    cmd: |
      set -u
      SPEC=$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' codegen/api.json | head -1)
      LATEST=$(curl -fsSL https://raw.githubusercontent.com/PaulSonOfLars/telegram-bot-api-spec/main/api.json \
        | sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' | head -1)
      echo "vendored: ${SPEC}"
      echo "upstream: ${LATEST}"
      if [ "${SPEC}" = "${LATEST}" ]; then
        echo "Up to date."
      else
        echo "A newer spec is out — 'task codegen:fetch && task codegen'."
      fi

  lint:totality:
    desc: >
      Guard the decode boundary: no `panic` and no `let assert` in
      `update.gleam` or in anything the generator writes. A malformed update
      must decode to `UnknownUpdate`, never take the poller down.
    cmd: |
      set -u
      if grep -rnE 'panic|let assert' src/telega/update.gleam src/telega/model/ \
        src/telega/internal/method_info.gleam src/telega/internal/update_info.gleam; then
        echo ""
        echo "Totality lint failed: rewrite the matches above as a total 'case'."
        exit 1
      fi
      echo "Totality lint passed."

  test:
    desc: Run tests in root project
    cmd: gleam test

  test:load:
    desc: >
      Run the suite with the phase-2 load criterion at full size: 100 000 chat
      instances evicted after going idle. Holds every instance live at once
      (~2.8 GB), which is why the default run uses a twentieth of that.
    cmd: TELEGA_LOAD_CHATS=100000 gleam test

  test:all:
    desc: Run tests in root project, all ecosystem packages, and all examples
    cmds:
      - gleam test
      - for: { var: PACKAGES }
        cmd: cd {{.ITEM}} && gleam test
      - for: { var: EXAMPLES }
        cmd: cd examples/{{.ITEM}} && gleam test

  tag:
    desc: >
      Tag the current commit with the core version from gleam.toml (v<version>),
      after checking the changelog mentions it. Run it right after `task publish`
      so every published version is findable in git.
    cmd: |
      set -eu
      VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' gleam.toml)
      TAG="v${VERSION}"
      if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
        echo "${TAG} already exists."
        exit 1
      fi
      if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
        echo "CHANGELOG.md has no '## [${VERSION}]' section — write the release notes first."
        exit 1
      fi
      git tag -a "${TAG}" -m "${TAG}"
      echo "Tagged ${TAG}. Push it with: git push origin ${TAG}"

  publish:
    desc: >
      Publish the core telega package, then every ecosystem package, to Hex.
      Bump the `version` of each package you changed first. Any package whose
      current version is already on Hex is skipped (checked via the Hex API),
      so the task is safe to re-run after a partial publish.
    cmds:
      - task: publish:core
      - task: publish:packages

  publish:core:
    desc: Publish the core telega package to Hex (skips if this version is already on Hex)
    cmd: |
      set -u
      NAME=$(sed -nE 's/^name = "([^"]+)"/\1/p' gleam.toml)
      VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' gleam.toml)
      CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/${NAME}/releases/${VERSION}")
      if [ "${CODE}" = "200" ]; then
        echo "==> ${NAME}@${VERSION} already on Hex — skipping"
      else
        gleam publish
      fi

  publish:packages:
    desc: >
      Publish every ecosystem package to Hex. Packages that use a local path
      dependency on telega (`telega = { path = ".." }`) have it temporarily
      rewritten to a version requirement (derived from the core version) for the
      publish, then restored from git so local dev/CI keep using the path dep.
      Requires the core to already be published on Hex.
    cmd: |
      set -u
      CORE=$(sed -nE 's/^version = "([^"]+)"/\1/p' gleam.toml)
      MAJOR=${CORE%%.*}
      REQ=">= ${CORE} and < $((MAJOR + 1)).0.0"
      echo "telega requirement for path-dependent packages: ${REQ}"
      failed=""
      for pkg in {{.PACKAGES}}; do
        echo ""
        VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' "${pkg}/gleam.toml")
        CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/${pkg}/releases/${VERSION}")
        if [ "${CODE}" = "200" ]; then
          echo "==> ${pkg}@${VERSION} already on Hex — skipping"
          continue
        fi
        echo "==> Publishing ${pkg}@${VERSION}"
        swapped=0
        if grep -q '^telega = { path = "\.\." }' "${pkg}/gleam.toml"; then
          sed -i.bak "s#^telega = { path = \"\.\.\" }#telega = \"${REQ}\"#" "${pkg}/gleam.toml"
          rm -f "${pkg}/gleam.toml.bak"
          swapped=1
        fi
        ( cd "${pkg}" && gleam publish ) || failed="${failed} ${pkg}"
        if [ "${swapped}" -eq 1 ]; then
          git -C "${pkg}" checkout -- gleam.toml manifest.toml
        fi
      done
      if [ -n "${failed}" ]; then
        echo ""
        echo "Failed to publish (errored):${failed}"
        exit 1
      fi
      echo ""
      echo "All packages published (or already on Hex)."
