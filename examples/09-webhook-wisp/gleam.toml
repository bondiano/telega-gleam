name = "bot"
version = "1.0.0"
description = "Telega webhook bot: wisp, health probe, idempotency, graceful drain"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.2.0 and < 2.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 6.0.0 and < 7.0.0"
envoy = ">= 1.0.2 and < 2.0.0"
telega = { path = "../.." }
telega_wisp = { path = "../../telega_wisp" }
telega_httpc = { path = "../../telega_httpc" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
