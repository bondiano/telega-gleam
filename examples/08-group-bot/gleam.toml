name = "bot"
version = "1.0.0"
description = "Telega group bot: chat-scoped data and persisted reminders"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.2.0 and < 2.0.0"
sqlight = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.2 and < 2.0.0"
telega = { path = "../.." }
telega_httpc = { path = "../../telega_httpc" }
telega_storage_sqlite = { path = "../../telega_storage_sqlite" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
